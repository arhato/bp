name: Build, analyze coode, test and deploy ASP.Net Core app to an Azure Web App

env:
    AZURE_WEBAPP_NAME: bpcalculator
    AZURE_WEBAPP_PACKAGE_PATH: "./publish"
    DOTNET_VERSION: "10.0.x"

on: workflow_dispatch

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        
        steps:
            -   uses: actions/checkout@v7

            -   name: Set up .NET Core
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: ${{ env.DOTNET_VERSION }}

            -   name: Set up dependency caching for faster builds
                uses: actions/cache@v6
                with:
                    path: ~/.nuget/packages
                    key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
                    restore-keys: |
                        ${{ runner.os }}-nuget-

            -   name: Build with dotnet
                run: dotnet build --configuration Release

            -   name: dotnet publish
                run: dotnet publish ./BPCalculator/BPCalculator.csproj -c Release -o ./publish

            -   name: Upload artifact for deployment job
                uses: actions/upload-artifact@v7
                with:
                    name: .net-app
                    path: ./publish
    
    sonarqube:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: SonarQube Scan
                uses: SonarSource/sonarqube-scan-action@v8.3.0
                with:
                    projectBaseDir: .
                    args: >
                        -Dsonar.organization=arhato
                        -Dsonar.projectKey=arhato_bmi-exercise
                env:
                    SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    
    test:
        runs-on: ubuntu-latest
        needs: build
        steps:
            -   uses: actions/checkout@v7

            -   name: Set up .NET Core
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: ${{ env.DOTNET_VERSION }}

            -   name: Test with dotnet
                run: dotnet test --configuration Release
    
    deploy:
        permissions:
            contents: none
        runs-on: ubuntu-latest
        needs:
            - build
            - test
        environment:
            name: "Development"
            url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
        
        steps:
            -   name: Download artifact from build job
                uses: actions/download-artifact@v8
                with:
                    name: .net-app
                    path: ./publish

            -   name: Deploy to Azure Web App
                id: deploy-to-webapp
                uses: azure/webapps-deploy@v2
                with:
                    app-name: ${{ env.AZURE_WEBAPP_NAME }}
                    publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
                    package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}